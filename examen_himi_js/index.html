<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen de JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body id="color">
    <header>
        <h1>Citas de Kingdom Hearts</h1>

    <main>
        <div>

        </div>
        <section id="frases"></section>
    </main>
