<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franquicia de Jurassic Park.</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Lista con la franquicia de películas de Jurassic Park.</h1>
    </header>

    <main>
        <section id="info"></section>
        <nav>
            <button type="button" id="ant" onclick="prev()">Anterior</button>
            <button type="button" id="one" onclick="start()">Primero</button>
            <button type="button" onclick="rand()">Aleatorio</button>
            <button type="button" id="ult" onclick="last()">Último</button>
            <button type="button" id="sig" onclick="next()">Siguiente</button>
        </nav>
    </main>

    <footer>
        <p>&copy; Jurassic Park.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
